# Broker Mosquitto para la matera. Arranque:  mosquitto -c broker/mosquitto.conf
# En Windows: instalar Mosquitto y abrir el puerto 1883 en el firewall.

listener 1883
persistence false

# Sin retain ni sesiones guardadas: el broker no conserva tokens.
retain_available false

# Usuarios (crear una vez):
#   mosquitto_passwd -c broker/claves servidor
#   mosquitto_passwd broker/claves dispositivos
allow_anonymous false
password_file broker/claves
acl_file broker/acl
